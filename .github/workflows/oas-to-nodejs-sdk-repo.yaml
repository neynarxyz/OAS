name: Update NodeJS SDK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual trigger'
  repository_dispatch:
    types: [oas-updated]

permissions:
  contents: read

jobs:
  update-sdk:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.generate.outputs.changed }}
    steps:
      - name: Dump GitHub context # Makes it much easier to retrospectively debug all sorts of workflow issues. Does NOT expose secrets.
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
        
      - name: Checkout OAS repository
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          persist-credentials: false

      - name: Checkout nodejs-sdk repository
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          repository: "neynarxyz/nodejs-sdk.git"
          ref: "main"
          path: "nodejs-sdk"
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: ">=19.9.0"

      - name: Update OAS submodule and package version in nodejs-sdk
        id: generate
        run: |
          # Get the author information from the OAS commit
          AUTHOR_NAME=$(git log -1 --format='%an')
          AUTHOR_EMAIL=$(git log -1 --format='%ae')

          cd nodejs-sdk

          # Update OAS submodule over public HTTPS (no SSH key in this job)
          git config submodule.oas.url https://github.com/neynarxyz/OAS.git
          git submodule sync oas
          git submodule update --remote oas

          # Set Git config using OAS commit author
          git config user.name "$AUTHOR_NAME (via Neynar CI Bot)"
          git config user.email "$AUTHOR_EMAIL"

          # Parse version from OAS
          # Install yq for YAML parsing
          sudo wget -O /usr/bin/yq https://github.com/mikefarah/yq/releases/download/v4.24.5/yq_linux_amd64
          sudo chmod +x /usr/bin/yq
          SDK_VERSION=$(yq e '.info."version"' oas/src/api/spec.yaml)
          echo "SDK Version: $SDK_VERSION"

          # Check if SDK_VERSION is empty
          if [ -z "$SDK_VERSION" ]; then
            echo "Error: version not found in OAS file."
            exit 1
          fi

          # Generate code
          yarn install
          yarn generate:all
          yarn build

          # Update package.json version
          npm version --no-git-tag-version "$SDK_VERSION" || true

          # Stage and commit any changes
          if git diff --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add .
          git commit -m "[GitHub Actions] Generate NodeJS SDK v$SDK_VERSION from OAS repo"
          echo "changed=true" >> "$GITHUB_OUTPUT"

        shell: bash

      - name: Export generated commit as a patch
        if: steps.generate.outputs.changed == 'true'
        working-directory: nodejs-sdk
        run: git format-patch -1 --binary --stdout HEAD > "$RUNNER_TEMP/sdk.patch"

      - name: Upload generated commit
        if: steps.generate.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nodejs-sdk-patch
          path: ${{ runner.temp }}/sdk.patch
          retention-days: 1

  # Push from a fresh checkout so nothing generation or `yarn install` changed
  # (git config, remotes, helpers) is present when the token exists.
  push-sdk:
    needs: update-sdk
    if: needs.update-sdk.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nodejs-sdk repository
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          repository: "neynarxyz/nodejs-sdk.git"
          ref: "main"
          path: "nodejs-sdk"
          persist-credentials: false

      - name: Download generated commit
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nodejs-sdk-patch
          path: ${{ runner.temp }}/patch

      - name: Apply generated commit
        working-directory: nodejs-sdk
        run: |
          git config user.name "Neynar CI Bot"
          git config user.email "ci-bot@neynar.com"
          git -c core.hooksPath=/dev/null am --keep-cr "$RUNNER_TEMP/patch/sdk.patch"

      - name: Generate Neynar CI Bot token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.NEYNAR_CI_BOT_APP_ID }}
          private-key: ${{ secrets.NEYNAR_CI_BOT_PRIVATE_KEY }}
          owner: "neynarxyz"
          repositories: "nodejs-sdk"
          permission-contents: write

      - name: Push to nodejs-sdk main
        working-directory: nodejs-sdk
        env:
          BOT_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          # Push directly to main using the bot credentials
          AUTH=$(printf 'x-access-token:%s' "$BOT_TOKEN" | base64 -w0)
          git -c core.hooksPath=/dev/null \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            push origin HEAD:main
